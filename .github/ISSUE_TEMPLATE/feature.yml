name: Feature
description: Propose a user-facing change
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Problem, actor and desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results and edge cases
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and references
      description: Dependencies, risks, documentation and links
